# Controller 3 of the kafka-optimisation-toolkit cluster (Apache Kafka 4.3, KRaft).
#
# Everything not listed here is left at its Kafka 4.3 default. The only
# settings below are the ones a KRaft controller cannot start without: its
# role, its identity, the quorum, its listener and its metadata log directory.
# See SOURCES.md for the 4.3 reference each default and key was checked against.

# Required: this process is a dedicated controller (not combined mode).
process.roles=controller

# Required: unique node id. Controllers use 101-103 so they never collide
# with broker ids 1-3.
node.id=103

# Quorum: the three dedicated controllers form a static voter set. The 4.3
# docs prefer controller.quorum.bootstrap.servers for dynamic quorums. A
# benchmark cluster never changes its voters, so the static form is simpler.
controller.quorum.voters=101@controller-1:9093,102@controller-2:9093,103@controller-3:9093

# Quorum: the listener name the quorum traffic uses.
controller.listener.names=CONTROLLER

# Listener: the controller listens only for quorum and broker heartbeat traffic.
# The default (PLAINTEXT://:9092) is a client listener, which a controller must not have.
listeners=CONTROLLER://:9093

# Listener: map the controller listener name to a protocol. The default map
# has no CONTROLLER entry.
listener.security.protocol.map=CONTROLLER:PLAINTEXT

# Log dirs: the Docker volume holding this controller's metadata log.
log.dirs=/var/lib/kafka/data
