# Broker 1 of the kafka-optimisation-toolkit cluster (Apache Kafka 4.3, KRaft).
#
# Everything not listed here is left at its Kafka 4.3 default so that the
# benchmarks measure stock behaviour. The only settings below are the ones a
# KRaft broker cannot start without: its role, its identity, how it reaches
# the controller quorum, its listeners and where it keeps its log segments.
# See SOURCES.md for the 4.3 reference each default and key was checked against.

# Required: this process is a dedicated broker. Controllers run in separate
# containers so that controller work never competes with the request path.
process.roles=broker

# Required: unique node id. Brokers use 1-3, controllers use 101-103.
node.id=1

# Quorum: the three dedicated controllers form a static voter set. The 4.3
# docs prefer controller.quorum.bootstrap.servers for dynamic quorums. A
# benchmark cluster never changes its voters, so the static form is simpler.
controller.quorum.voters=101@controller-1:9093,102@controller-2:9093,103@controller-3:9093

# Quorum: a broker must name the listener it uses to talk to the controllers.
controller.listener.names=CONTROLLER

# Listener: one plaintext listener inside the Docker network for clients and
# replication. The default (PLAINTEXT://:9092) binds the same port, it is set
# explicitly so the advertised address below has a matching listener.
listeners=PLAINTEXT://:9092

# Listener: advertise the Compose service name, which every container on the
# network resolves. The default (null) reuses listeners, whose empty host
# resolves to the container's own hostname rather than a stable name.
advertised.listeners=PLAINTEXT://broker-1:9092

# Listener: map the controller listener name to a protocol. The default map
# has no CONTROLLER entry.
listener.security.protocol.map=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT

# Log dirs: the Docker volume mounted for this broker. The default (null, which
# falls back to log.dir=/tmp/kafka-logs) would put data on the container layer.
log.dirs=/var/lib/kafka/data
